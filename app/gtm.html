<script>
(function(){
  function iniciar(){
    var LS=window.LS||{},t=LS.template||"",k=t==="page"?"page:"+location.pathname:t;
    var conocidas=["home","product","category","search","404","page:/quienes-somos/","page:/politicas-de-cambio/","page:/politicas-de-envio/"];

    var listo=function(){var o=document.getElementById("iss-oculta");if(o)o.remove();};
    if(!viejo&&(publicadas.indexOf(k)>-1||k==="home"||(prueba&&conocidas.indexOf(k)>-1))){
