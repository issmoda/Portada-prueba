<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISS MODA · página no encontrada (modelo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Courier+Prime:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Shrikhand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
.e{text-align:center;padding:40px 18px 0;position:relative}
.e .num{font-family:var(--caps);font-weight:700;font-size:150px;line-height:.85;color:transparent;-webkit-text-stroke:2px var(--bordo);position:relative;display:inline-block}
.e .num span{display:inline-block;animation:cuelga 2.8s ease-in-out infinite;transform-origin:50% 0}
.e .num span:nth-child(2){animation-delay:.3s;color:var(--rosa2);-webkit-text-stroke:2px var(--chicle)}
.e .num span:nth-child(3){animation-delay:.6s}
@keyframes cuelga{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.e .it{font-size:54px;display:block;margin-top:14px}
.e p{font-size:15px;color:var(--gris);max-width:300px;margin:12px auto 20px}
.e .buscador{max-width:360px;margin:0 auto;cursor:text}
.e .botones{display:flex;gap:10px;justify-content:center;margin-top:16px}
.sug{padding:40px 18px 0}
.sug .grilla-e{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin-top:16px}
.sug .pr{width:auto;max-width:none}
.sug .pr .ft{transform:none!important;margin-top:0!important}
</style>
</head>
<body>
<div id="cabecera"></div>
<section class="e">
  <span class="corchete">[ ups ]</span><br>
  <div class="num"><span>4</span><span>0</span><span>4</span></div>
  <span class="it">Esta prenda ya voló</span>
  <p>La página que buscás no existe o ese producto se agotó. Pero tenemos mucho más para vos:</p>
  <div class="buscador" role="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Buscar una prenda…</span></div>
  <div class="botones"><a class="cta" href="index.html">Ir al inicio</a></div>
</section>
<section class="sug"><div class="tit sube in" style="padding:0"><span class="caps" style="display:block;opacity:1;transform:none">Mirá</span><span class="it" style="opacity:1;transform:none">lo nuevo</span></div><div class="grilla-e" id="g"></div></section>
<div id="pie"></div>
<script src="comun.js"></script>
<script>
issCabecera("Modelo de prueba · página de error amigable");
issDatos().then(function(P){document.getElementById("g").innerHTML=P.slice(0,4).map(issTarjeta).join("")});
</script>
</body>
</html>
