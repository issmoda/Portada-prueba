<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISS MODA · mi cuenta (modelo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Courier+Prime:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Shrikhand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
.cu{max-width:460px;margin:0 auto;padding:34px 18px 0}
.cu .caps{display:block;font-size:44px;margin-top:10px;animation:subeL .7s .1s both}
.cu .it{font-size:58px;display:inline-block;animation:subeL .7s .25s both}
@keyframes subeL{from{opacity:0;transform:translateY(26px)}}
.sw-t{display:flex;margin-top:24px;border:1.5px solid var(--bordo);position:relative}
.sw-t button{flex:1;padding:12px;font-family:var(--caps);font-size:17px;text-transform:uppercase;position:relative;z-index:2;transition:color .3s}
.sw-t button.on{color:#fff}
.sw-t i{position:absolute;top:0;bottom:0;left:0;width:50%;background:var(--bordo);transition:transform .4s cubic-bezier(.2,1.2,.4,1)}
.sw-t.reg i{transform:translateX(100%)}
.form{margin-top:20px}
.campo{position:relative;margin-top:14px}
.campo input{width:100%;padding:20px 14px 8px;border:1.5px solid var(--beige2);background:#fff;font:inherit;font-size:15px;outline:none;transition:border-color .2s}
.campo label{position:absolute;left:14px;top:15px;font-size:14px;color:var(--gris);pointer-events:none;transition:.2s}
.campo input:focus{border-color:var(--chicle)}
.campo input:focus+label,.campo input:not(:placeholder-shown)+label{top:6px;font-size:11px;color:var(--bordo);font-weight:700}
.olvido{display:block;text-align:right;font-size:12.5px;text-decoration:underline;margin-top:8px;color:var(--bordo)}
.form .cta{width:100%;margin-top:18px}
.ventajas{margin-top:30px;background:var(--rosa) var(--grano);padding:20px 18px}
.ventajas b{font-family:var(--caps);font-size:20px;text-transform:uppercase;color:var(--bordo)}
.ventajas li{list-style:none;font-size:14px;padding:7px 0 7px 26px;position:relative}
.ventajas li:before{content:"★";position:absolute;left:2px;color:var(--chicle)}
.reg-only{display:none}
.modo-reg .reg-only{display:block}
.modo-reg .login-only{display:none}
.ok-msg{display:none;text-align:center;padding:30px 0}
.ok-msg p{font-family:var(--serif);font-style:italic;font-size:34px;color:var(--bordo)}
</style>
</head>
<body>
<div id="cabecera"></div>
<section class="cu" id="cu">
  <span class="corchete">[ mi cuenta ]</span>
  <span class="caps login-only">Hola de</span><span class="it login-only">nuevo</span>
  <span class="caps reg-only">Sumate a</span><span class="it reg-only">ISS</span>
  <div class="sw-t" id="sw"><i></i><button class="on" data-m="log">Ingresar</button><button data-m="reg">Crear cuenta</button></div>
  <form class="form" id="form" onsubmit="return enviar()">
    <div class="campo reg-only"><input id="fNom" placeholder=" "><label>Tu nombre</label></div>
    <div class="campo"><input type="email" placeholder=" " required><label>Email</label></div>
    <div class="campo"><input type="password" placeholder=" " required><label>Contraseña</label></div>
    <a class="olvido login-only" href="#">¿Te olvidaste la contraseña?</a>
    <button class="cta" id="fBtn">Ingresar</button>
  </form>
  <div class="ok-msg" id="ok"><p id="okT"></p><small style="color:var(--gris)">(modelo: en la tienda real esto lo maneja Tiendanube)</small></div>
  <div class="ventajas"><b>Con tu cuenta</b><ul><li>Seguís tus pedidos</li><li>Comprás más rápido: tus datos quedan guardados</li><li>Ves todas tus compras anteriores</li></ul></div>
</section>
<div id="pie"></div>
<script src="comun.js"></script>
<script>
issCabecera("Modelo de prueba · ingresar y crear cuenta");
var reg=false;
document.getElementById("sw").onclick=function(e){var b=e.target.closest("button");if(!b)return;reg=b.dataset.m==="reg";this.classList.toggle("reg",reg);
  [].forEach.call(this.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b)});document.getElementById("cu").classList.toggle("modo-reg",reg);document.getElementById("fBtn").textContent=reg?"Crear mi cuenta":"Ingresar";};
function enviar(){document.getElementById("form").style.display="none";document.getElementById("ok").style.display="block";
  var n=document.getElementById("fNom").value.trim();document.getElementById("okT").textContent=reg?("¡Bienvenida"+(n?", "+n:"")+"! 💌"):"¡Qué bueno verte!";return false;}
</script>
</body>
</html>
